[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drillrheo"
version = "0.1.0"
description = "Automated rheological model fitting and statistically rigorous model selection for drilling fluids, from raw Fann viscometer dial readings."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Suhail F. H. Al-Serri", email = "suhailalserri@gmail.com" }
]
requires-python = ">=3.9"
keywords = ["drilling fluids", "rheology", "petroleum engineering", "Fann viscometer", "Herschel-Bulkley", "Bingham plastic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
drillrheo = "drillrheo.cli:cli"

[project.urls]
Homepage = "https://github.com/vector-n/drillrheo"
Repository = "https://github.com/vector-n/drillrheo"
Issues = "https://github.com/vector-n/drillrheo/issues"

[tool.setuptools.packages.find]
include = ["drillrheo*"]
